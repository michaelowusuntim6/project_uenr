# NOTE: reference profile. Its batch/step/LR values are deliberately not the
# cloud-tuned defaults; see config/uenr.toml and docs/ARCH_OPTIMIZATION.md.
# 16k-vocabulary tokenizer training recipe (model retrain required to use it).
# Train with: ./uenr --config config/tokenizer16k.toml tok-train
[run]
name = "uenr-tok16k"
seed = 1337
threads = 2
pin_cpu0 = 0
pin_cpu1 = 2
log_every = 10
checkpoint_every = 0
smt_threads = 1
simd = "auto"
checkpoint_dir = "checkpoints"
resume = false

[paths]
data = "data/tinystories_train.txt"
train_bin = "data/train16k.bin"
val_bin = "data/val16k.bin"
sft_jsonl = "data/sft16k.jsonl"
pairs_jsonl = "data/pairs16k.jsonl"
tokenizer = "artifacts/tokenizer16k.bin"
vocab_file = "artifacts/vocab16k.txt"
merges_file = "artifacts/merges16k.txt"
model_out = "checkpoints/model16k.bin"
ema_out = "checkpoints/model16k_ema.bin"
log_csv = "checkpoints/metrics16k.csv"
sft_out = "checkpoints/sft16k.bin"
lora_out = "checkpoints/lora16k.bin"
dpo_out = "checkpoints/dpo16k.bin"
ppo_out = "checkpoints/ppo16k.bin"
grpo_out = "checkpoints/grpo16k.bin"

[hardware]
huge_pages = false

[model]
vocab_size = 16384
hidden = 192
layers = 4
heads = 6
kv_heads = 1
head_dim = 32
ffn = 277
rms_eps = 1.0e-6
rope_theta = 1000000.0
rope_scale = 1.0
rope_yarn = false
rope_beta_fast = 32.0
rope_beta_slow = 1.0
rope_attn_factor = 1.0
rope_theta_local = 10000.0
rope_partial_local = 1.0
rope_theta_global = 1000000.0
rope_partial_global = 1.0
kv_shared_layers = 2
attn_pattern = "SGSG"
sliding_window = 128
attn_scale = 0.0
v_norm = false
kv_adapter = false
attn_softcap = 50.0
final_softcap = 30.0
post_norm_init = 0.0
tie_embeddings = true
max_seq = 512
flash_attn = false

[moe]
enabled = true
num_experts = 24
experts_per_tok = 1
expert_ffn = 128
shared_expert = true
router_aux_coef = 0.01

[tokenizer]
kind = "bpe"
lowercase = false
normalize_unicode = true
strip_control = true
pretokenize = true
min_pair_freq = 2
train_bytes = 8388608
add_bos = true
add_eos = true
bos_id = 1
eos_id = 2
pad_id = 0
unk_id = 3
ignore_index = -100
special_system = 4
special_user = 5
special_assistant = 6
special_tool_call = 7
special_tool_result = 8
special_end = 9

[prepare]
max_bytes = 209715200
val_percent = 2
dedup = true
dedup_slots = 1048576
sft_stories = 2000
sft_prompt_chars = 160
tool_examples = 500

[training]
batch_size = 8
grad_accum = 2
seq_len = 256
max_steps = 20000
lr = 1.0e-3
min_lr = 5.0e-5
warmup_steps = 20
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.999
adam_eps = 1.0e-8
clip = 1.0
sampled_softmax = false
sampled_negatives = 256
recompute_swiglu = false
z_loss = 0.0
ema_decay = 0.0
optim8 = false
recompute_attn = false
kv_qat_bits = 0
kv_lowrank = 0
adafactor = true
seq_ramp_steps = 0
muon = false

[schedule]
kind = "adaptive"
tokens_per_param = 20.0
min_epochs = 1
max_epochs = 10
target_loss = 2.2
plateau_window = 20
plateau_delta = 0.01
min_steps_before_stop = 10
ema_beta = 0.98

[lora]
rank = 8
alpha = 16.0
targets = ["q_proj", "k_proj", "v_proj", "o_proj"]

[dpo]
beta = 0.1
ref_checkpoint = "checkpoints/sft16k.bin"

[ppo]
clip_ratio = 0.2
kl_coef = 0.02
rollouts = 4

[grpo]
group_size = 8
kl_coef = 0.02

[reward]
kind = "heuristic"
checkpoint = "checkpoints/reward.bin"
steps = 200
lr = 1.0e-3

[rl]
max_new_tokens = 64
temperature = 1.0
reward_format = 0.5
reward_length = 0.2
length_target = 48
reward_repeat = 0.3

[inference]
max_new_tokens = 256
system = "You are UENR, a tiny helpful assistant."
temperature = 0.8
top_k = 40
top_p = 0.95
greedy = false
kv_cache = true
kv_int8 = false
weight_int8 = false
kv_fp16 = false
kv_q4 = false
kv_rotate = false
kv_q2 = false
kv_sinks = 4
kv_recent = 32
kv_evict = true
kv_evict_window = 256
kv_sparse_k = 32
kv_lowrank = 0
early_exit = false
early_exit_delta = 0.05
kv_offload = false
kv_offload_file = "checkpoints/kv_offload.bin"
prefix_cache = true
draft_model = ""
draft_config = "config/draft.toml"
draft_k = 4
batch_max = 8
continuous = true
repetition_penalty = 1.1
repetition_last_n = 256
no_repeat_ngram = 3
min_p = 0.0
json_constrained = true
speculative = false
spec_k = 4
spec_ngram = 3

[bench]
gemm_size = 256

[eval]
split = "val"
batches = 16
seq_len = 256
nseq = 4
gen_tokens = 32
prompt = "Once upon a time"
