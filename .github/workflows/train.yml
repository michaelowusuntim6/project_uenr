name: UENR cloud CPU training

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Training mode"
        required: true
        type: choice
        default: smoke
        options: [pretrain, sft, lora, dpo, grpo, ppo, train-rm, eval, full-core, full-rl, smoke]
      steps_pretrain:
        description: "Pretrain optimizer steps"
        required: false
        default: "2000"
        type: string
      steps_sft:
        description: "SFT optimizer steps"
        required: false
        default: "300"
        type: string
      steps_lora:
        description: "LoRA optimizer steps"
        required: false
        default: "300"
        type: string
      steps_dpo:
        description: "DPO optimizer steps"
        required: false
        default: "300"
        type: string
      steps_grpo:
        description: "GRPO optimizer steps"
        required: false
        default: "200"
        type: string
      steps_ppo:
        description: "PPO optimizer steps"
        required: false
        default: "200"
        type: string
      steps_train_rm:
        description: "Reward-model optimizer steps"
        required: false
        default: "150"
        type: string
      bootstrap_datasets:
        description: "Download/convert datasets on first run (then cached in release tags)"
        required: false
        default: true
        type: boolean
      reward:
        description: "RL reward source"
        required: false
        default: heuristic
        type: choice
        options: [heuristic, rm]

permissions:
  contents: write

concurrency:
  group: uenr-cloud-training
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build for the runner CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build
        run: make -j"$(nproc)" CFLAGS="-O3 -march=x86-64-v3 -mavx2 -mf16c -pthread"
      - uses: actions/upload-artifact@v4
        with:
          name: uenr-bin
          path: uenr
          retention-days: 7

  diagnostic:
    name: Diagnostic
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: uenr-bin
      - run: |
          chmod +x uenr
          lscpu || true
          nproc
          free -h
          df -h
          ./uenr config | tee /tmp/config.txt
          {
            echo "### Diagnostic"
            echo '```'
            head -40 /tmp/config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  restore-datasets:
    name: Restore/bootstrap datasets
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: uenr-bin
      - name: Bootstrap or download stable dataset assets
        env:
          BOOTSTRAP_DATASETS: ${{ inputs.bootstrap_datasets }}
        run: |
          chmod +x uenr scripts/bootstrap_datasets.sh
          scripts/bootstrap_datasets.sh

  prepare-all:
    name: Prepare all phase data
    runs-on: ubuntu-latest
    needs: [build, restore-datasets]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: uenr-bin
      - name: Download cached dataset assets
        run: |
          mkdir -p data artifacts checkpoints
          gh release download dataset-pretrain -p tinystories_train.txt -D data --clobber
          gh release download dataset-sft -p sft_tinystories.jsonl -D data --clobber
          gh release download dataset-dpo -p prefs_tinystories.jsonl -D data --clobber
          gh release download dataset-rl -p rl_prompts.jsonl -D data --clobber
      - name: Tokenize and prepare every phase
        run: |
          chmod +x uenr
          ./uenr tok-train
          ./uenr prepare --phase all
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-train
          path: |
            data/train.bin
            data/val.bin
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-sft
          path: |
            data/sft.jsonl
            data/lora.jsonl
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-dpo
          path: |
            data/pairs.jsonl
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-rl
          path: |
            data/rl_prompts.jsonl
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7

  # Wall-time estimates are for the 4-vCPU runner with default step counts.
  # pretrain: ~2000 steps × 8192 tokens ≈ 16.4M tokens, target < 200 min.
  pretrain:
    name: Pretrain
    runs-on: ubuntu-latest
    needs: [build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'pretrain' || inputs.mode == 'full-core' || inputs.mode == 'smoke') }}
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-train }
      - name: Run pretrain
        env:
          STEPS_INPUT: ${{ inputs.steps_pretrain }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=20
          scripts/run_phase.sh pretrain "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretrain-checkpoint-run
          path: checkpoints/pretrain.bin
          if-no-files-found: warn
          retention-days: 7

  # sft: ~300 steps, target < 60 min.
  sft:
    name: SFT
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'sft' || inputs.mode == 'full-core' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-sft }
      - name: Run SFT
        env:
          STEPS_INPUT: ${{ inputs.steps_sft }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=20
          scripts/run_phase.sh sft "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sft-checkpoint-run
          path: checkpoints/sft.bin
          if-no-files-found: warn
          retention-days: 7

  # lora: ~300 steps, target < 45 min.
  lora:
    name: LoRA
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'lora' || inputs.mode == 'full-core' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-sft }
      - name: Run LoRA
        env:
          STEPS_INPUT: ${{ inputs.steps_lora }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=20
          scripts/run_phase.sh lora "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lora-checkpoint-run
          path: checkpoints/lora.bin
          if-no-files-found: warn
          retention-days: 7

  # train-rm: ~150 steps, target < 30 min.
  train-rm:
    name: Reward model
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'train-rm' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-dpo }
      - name: Run reward model
        env:
          STEPS_INPUT: ${{ inputs.steps_train_rm }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh train-rm "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-rm-checkpoint-run
          path: checkpoints/train-rm.bin
          if-no-files-found: warn
          retention-days: 7

  # dpo: ~300 steps, target < 45 min.
  dpo:
    name: DPO
    runs-on: ubuntu-latest
    needs: [pretrain, sft, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'dpo' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') && (needs.sft.result == 'success' || needs.sft.result == 'skipped') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-dpo }
      - name: Run DPO
        env:
          STEPS_INPUT: ${{ inputs.steps_dpo }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh dpo "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpo-checkpoint-run
          path: checkpoints/dpo.bin
          if-no-files-found: warn
          retention-days: 7

  # grpo: ~200 steps, target < 90 min.
  grpo:
    name: GRPO
    runs-on: ubuntu-latest
    needs: [sft, train-rm, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'grpo' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.sft.result == 'success' || needs.sft.result == 'skipped') && (needs.train-rm.result == 'success' || needs.train-rm.result == 'skipped') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-rl }
      - name: Optional learned reward
        if: ${{ inputs.reward == 'rm' }}
        run: |
          mkdir -p checkpoints
          gh release download train-rm-checkpoint -p train-rm.bin -D checkpoints --clobber
          cp checkpoints/train-rm.bin checkpoints/reward.bin
          sed -i 's/^kind = "heuristic"/kind = "model"/' config/uenr.toml
      - name: Run GRPO
        env:
          STEPS_INPUT: ${{ inputs.steps_grpo }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh grpo "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpo-checkpoint-run
          path: checkpoints/grpo.bin
          if-no-files-found: warn
          retention-days: 7

  # ppo: ~200 steps, target < 75 min.
  ppo:
    name: PPO
    runs-on: ubuntu-latest
    needs: [sft, train-rm, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'ppo' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.sft.result == 'success' || needs.sft.result == 'skipped') && (needs.train-rm.result == 'success' || needs.train-rm.result == 'skipped') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-rl }
      - name: Optional learned reward
        if: ${{ inputs.reward == 'rm' }}
        run: |
          mkdir -p checkpoints
          gh release download train-rm-checkpoint -p train-rm.bin -D checkpoints --clobber
          cp checkpoints/train-rm.bin checkpoints/reward.bin
          sed -i 's/^kind = "heuristic"/kind = "model"/' config/uenr.toml
      - name: Run PPO
        env:
          STEPS_INPUT: ${{ inputs.steps_ppo }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh ppo "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-checkpoint-run
          path: checkpoints/ppo.bin
          if-no-files-found: warn
          retention-days: 7

  # eval: < 20 min.
  eval:
    name: Evaluate
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'eval' || inputs.mode == 'full-core' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-train }
      - name: Run evaluation
        run: |
          chmod +x uenr scripts/run_phase.sh
          scripts/run_phase.sh eval 0

  summarize:
    name: Summarize
    runs-on: ubuntu-latest
    needs: [pretrain, sft, lora, train-rm, dpo, grpo, ppo, eval]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Per-phase results
        run: |
          {
            echo "### UENR cloud run summary"
            echo "| phase | result | checkpoint tag |"
            echo "|---|---|---|"
            echo "| pretrain | ${{ needs.pretrain.result }} | pretrain-checkpoint |"
            echo "| sft | ${{ needs.sft.result }} | sft-checkpoint |"
            echo "| lora | ${{ needs.lora.result }} | lora-checkpoint |"
            echo "| train-rm | ${{ needs.train-rm.result }} | train-rm-checkpoint |"
            echo "| dpo | ${{ needs.dpo.result }} | dpo-checkpoint |"
            echo "| grpo | ${{ needs.grpo.result }} | grpo-checkpoint |"
            echo "| ppo | ${{ needs.ppo.result }} | ppo-checkpoint |"
            echo "| eval | ${{ needs.eval.result }} | n/a |"
          } >> "$GITHUB_STEP_SUMMARY"
