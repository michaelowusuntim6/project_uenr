name: UENR cloud CPU training

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Training mode"
        required: true
        type: choice
        default: smoke
        options: [pretrain, sft, lora, dpo, grpo, ppo, train-rm, eval, full-core, full-rl, smoke, bench]
      steps_pretrain:
        description: "Pretrain optimizer steps"
        required: false
        default: "2000"
        type: string
      steps_sft:
        description: "SFT optimizer steps"
        required: false
        default: "300"
        type: string
      steps_lora:
        description: "LoRA optimizer steps"
        required: false
        default: "300"
        type: string
      steps_dpo:
        description: "DPO optimizer steps"
        required: false
        default: "300"
        type: string
      steps_grpo:
        description: "GRPO optimizer steps"
        required: false
        default: "200"
        type: string
      steps_ppo:
        description: "PPO optimizer steps"
        required: false
        default: "200"
        type: string
      steps_train_rm:
        description: "Reward-model optimizer steps"
        required: false
        default: "150"
        type: string
      bootstrap_datasets:
        description: "Download/convert datasets on first run (then cached in release tags)"
        required: false
        default: true
        type: boolean
      reward:
        description: "RL reward source"
        required: false
        default: heuristic
        type: choice
        options: [heuristic, rm]

permissions:
  contents: write

concurrency:
  group: uenr-cloud-training
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build for the runner CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build (Ivy Bridge baseline + runtime-dispatched AVX2 objects)
        run: make -j"$(nproc)"
      - name: ISA check (AVX1 objects clean, AVX2 objects use FMA)
        run: make check-isa
      - name: "Test (auto dispatch: AVX2+FMA on this runner)"
        run: make test
      - name: Build benchmark tools
        run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: uenr-bin
          path: |
            uenr
            build/bench/kvbench
          retention-days: 7

  diagnostic:
    name: Diagnostic
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: uenr-bin
      - run: |
          chmod +x uenr
          echo "=== lscpu -e ==="
          lscpu -e=CPU,CORE,SOCKET,NODE,ONLINE,MAXMHZ,MINMHZ || true
          echo "=== topology summary ==="
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|L3' || true
          echo "=== nproc ==="
          nproc
          echo "=== thread_siblings_list ==="
          for f in /sys/devices/system/cpu/cpu*/topology/thread_siblings_list; do
            printf '%s: ' "$f"; cat "$f"
          done
          echo "=== cpuinfo ==="
          grep -m1 'model name' /proc/cpuinfo
          free -h
          df -h
          ./uenr config | tee /tmp/config.txt
          {
            echo "### Runner topology"
            echo '```'
            lscpu -e=CPU,CORE,SOCKET,NODE,ONLINE,MAXMHZ,MINMHZ || true
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|L3' || true
            echo '--- thread_siblings_list ---'
            for f in /sys/devices/system/cpu/cpu*/topology/thread_siblings_list; do
              printf '%s: ' "$f"; cat "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### Diagnostic"
            echo '```'
            head -40 /tmp/config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  restore-datasets:
    name: Restore/bootstrap datasets
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: uenr-bin
      - name: Bootstrap or download stable dataset assets
        env:
          BOOTSTRAP_DATASETS: ${{ inputs.bootstrap_datasets }}
        run: |
          chmod +x uenr scripts/bootstrap_datasets.sh
          scripts/bootstrap_datasets.sh

  prepare-all:
    name: Prepare all phase data
    runs-on: ubuntu-latest
    needs: [build, restore-datasets]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: uenr-bin
      - name: Download cached dataset assets
        run: |
          mkdir -p data artifacts checkpoints
          gh release download dataset-pretrain -p tinystories_train.txt -D data --clobber
          gh release download dataset-sft -p sft_tinystories.jsonl -D data --clobber
          gh release download dataset-dpo -p prefs_tinystories.jsonl -D data --clobber
          gh release download dataset-rl -p rl_prompts.jsonl -D data --clobber
      - name: Tokenize and prepare every phase
        run: |
          chmod +x uenr
          ./uenr tok-train
          ./uenr prepare --phase all
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-train
          path: |
            data/train.bin
            data/val.bin
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-sft
          path: |
            data/sft.jsonl
            data/lora.jsonl
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-dpo
          path: |
            data/pairs.jsonl
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-rl
          path: |
            data/rl_prompts.jsonl
            artifacts/tokenizer.bin
            artifacts/vocab.txt
            artifacts/merges.txt
          retention-days: 7

  # Wall-time estimates are for the 4-vCPU runner with default step counts.
  # pretrain: ~2000 steps × 8192 tokens ≈ 16.4M tokens, target < 200 min.
  pretrain:
    name: Pretrain
    runs-on: ubuntu-latest
    needs: [build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'pretrain' || inputs.mode == 'full-core' || inputs.mode == 'smoke') }}
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-train }
      - name: Run pretrain
        env:
          STEPS_INPUT: ${{ inputs.steps_pretrain }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=20
          scripts/run_phase.sh pretrain "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretrain-checkpoint-run
          path: checkpoints/pretrain.bin
          if-no-files-found: warn
          retention-days: 7

  # sft: ~300 steps, target < 60 min.
  sft:
    name: SFT
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'sft' || inputs.mode == 'full-core' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-sft }
      - name: Run SFT
        env:
          STEPS_INPUT: ${{ inputs.steps_sft }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=20
          scripts/run_phase.sh sft "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sft-checkpoint-run
          path: checkpoints/sft.bin
          if-no-files-found: warn
          retention-days: 7

  # lora: ~300 steps, target < 45 min.
  lora:
    name: LoRA
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'lora' || inputs.mode == 'full-core' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-sft }
      - name: Run LoRA
        env:
          STEPS_INPUT: ${{ inputs.steps_lora }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=20
          scripts/run_phase.sh lora "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lora-checkpoint-run
          path: checkpoints/lora.bin
          if-no-files-found: warn
          retention-days: 7

  # train-rm: ~150 steps, target < 30 min.
  train-rm:
    name: Reward model
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'train-rm' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-dpo }
      - name: Run reward model
        env:
          STEPS_INPUT: ${{ inputs.steps_train_rm }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh train-rm "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-rm-checkpoint-run
          path: checkpoints/train-rm.bin
          if-no-files-found: warn
          retention-days: 7

  # dpo: ~300 steps, target < 45 min.
  dpo:
    name: DPO
    runs-on: ubuntu-latest
    needs: [pretrain, sft, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'dpo' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') && (needs.sft.result == 'success' || needs.sft.result == 'skipped') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-dpo }
      - name: Run DPO
        env:
          STEPS_INPUT: ${{ inputs.steps_dpo }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh dpo "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpo-checkpoint-run
          path: checkpoints/dpo.bin
          if-no-files-found: warn
          retention-days: 7

  # grpo: ~200 steps, target < 90 min.
  grpo:
    name: GRPO
    runs-on: ubuntu-latest
    needs: [sft, train-rm, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'grpo' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.sft.result == 'success' || needs.sft.result == 'skipped') && (needs.train-rm.result == 'success' || needs.train-rm.result == 'skipped') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-rl }
      - name: Optional learned reward
        if: ${{ inputs.reward == 'rm' }}
        run: |
          mkdir -p checkpoints
          gh release download train-rm-checkpoint -p train-rm.bin -D checkpoints --clobber
          cp checkpoints/train-rm.bin checkpoints/reward.bin
          sed -i 's/^kind = "heuristic"/kind = "model"/' config/uenr.toml
      - name: Run GRPO
        env:
          STEPS_INPUT: ${{ inputs.steps_grpo }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh grpo "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpo-checkpoint-run
          path: checkpoints/grpo.bin
          if-no-files-found: warn
          retention-days: 7

  # ppo: ~200 steps, target < 75 min.
  ppo:
    name: PPO
    runs-on: ubuntu-latest
    needs: [sft, train-rm, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'ppo' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.sft.result == 'success' || needs.sft.result == 'skipped') && (needs.train-rm.result == 'success' || needs.train-rm.result == 'skipped') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-rl }
      - name: Optional learned reward
        if: ${{ inputs.reward == 'rm' }}
        run: |
          mkdir -p checkpoints
          gh release download train-rm-checkpoint -p train-rm.bin -D checkpoints --clobber
          cp checkpoints/train-rm.bin checkpoints/reward.bin
          sed -i 's/^kind = "heuristic"/kind = "model"/' config/uenr.toml
      - name: Run PPO
        env:
          STEPS_INPUT: ${{ inputs.steps_ppo }}
          MODE: ${{ inputs.mode }}
        run: |
          chmod +x uenr scripts/run_phase.sh
          STEPS=$STEPS_INPUT; [ "$MODE" = smoke ] && STEPS=10
          scripts/run_phase.sh ppo "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-checkpoint-run
          path: checkpoints/ppo.bin
          if-no-files-found: warn
          retention-days: 7

  # eval: < 20 min.
  eval:
    name: Evaluate
    runs-on: ubuntu-latest
    needs: [pretrain, build, prepare-all]
    if: ${{ !cancelled() && (inputs.mode == 'eval' || inputs.mode == 'full-core' || inputs.mode == 'full-rl' || inputs.mode == 'smoke') && (needs.pretrain.result == 'success' || needs.pretrain.result == 'skipped') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-train }
      - name: Run evaluation
        run: |
          chmod +x uenr scripts/run_phase.sh
          scripts/run_phase.sh eval 0

  # Dedicated AVX1-vs-AVX2 benchmark.  Runs on a fresh runner; no long
  # training and no checkpoint release is created.
  bench:
    name: SIMD benchmark
    runs-on: ubuntu-latest
    needs: [build, prepare-all]
    if: ${{ !cancelled() && inputs.mode == 'bench' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uenr-bin }
      - uses: actions/download-artifact@v4
        with: { name: prepared-train }
      - name: GEMM AVX1 vs AVX2+FMA
        run: |
          chmod +x uenr
          bench_one() {
            label=$1; shift
            out=$(./uenr bench "$@" 2>&1)
            echo "$out"
            echo "$out" | sed -n 's/.*: \([0-9.]*\) GFLOP.*/\1/p' | \
              awk -v l="$label" '{printf "%s\t%.3f\n", l, $1}' >> /tmp/gemm.tsv
          }
          : > /tmp/gemm.tsv
          for size in 384 1024; do
            for simd in avx1 avx2; do
              for th in 2 4; do
                if [ "$th" = 2 ]; then pins="--pin0 0 --pin1 2"; else pins="--pin0 0 --pin1 1"; fi
                bench_one "${size}-${simd}-${th}t" --size "$size" --simd "$simd" --threads "$th" $pins
              done
            done
            bench_one "${size}-avx2-2t-tile8" --size "$size" --simd avx2 --threads 2 --pin0 0 --pin1 2 --tile 1
            bench_one "${size}-avx2-2t-tile6" --size "$size" --simd avx2 --threads 2 --pin0 0 --pin1 2 --tile 2
          done
          {
            echo "### GEMM: AVX1 vs AVX2+FMA (GFLOP/s)"
            echo "| size | path | threads | GFLOP/s |"
            echo "|---|---|---:|---:|"
            while IFS=$'\t' read -r l v; do
              size=${l%%-*}; rest=${l#*-}; simd=${rest%%-*}; th=${rest#*-}
              echo "| $size | $simd | $th | $v |"
            done < /tmp/gemm.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "100-step pretrain: AVX1 vs AVX2+FMA"
        run: |
          train_one() {
            simd=$1; th=$2; pin1=$3
            rm -rf checkpoints && mkdir -p checkpoints
            out=$(./uenr train --steps 100 --simd "$simd" --threads "$th" \
                    --pin0 0 --pin1 "$pin1" 2>&1)
            echo "$out" | tail -3
            toks=$(echo "$out" | sed -n 's/.*| \([0-9][0-9]*\) tok\/s.*/\1/p' | \
              awk '{s+=$1;n++} END{if(n)printf "%.0f",s/n; else print "0"}')
            flops=$(echo "$out" | sed -n 's/.* \([0-9.]*\) GFLOP\/s.*/\1/p' | \
              awk '{s+=$1;n++} END{if(n)printf "%.2f",s/n; else print "0"}')
            echo "$simd $th $toks $flops" >> /tmp/train.tsv
          }
          : > /tmp/train.tsv
          train_one avx1 2 2
          train_one avx1 4 1
          train_one avx2 2 2
          train_one avx2 4 1
          {
            echo "### 100-step pretrain"
            echo "| path | threads | mean tok/s | mean GFLOP/s |"
            echo "|---|---:|---:|---:|"
            awk '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' /tmp/train.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Quantized KV decode (INT8 / Q4 unpack)"
        run: |
          chmod +x ./build/bench/kvbench
          : > /tmp/kv.tsv
          for simd in avx1 avx2; do
            out=$(./build/bench/kvbench checkpoints/model.bin 512 "$simd" 2>&1)
            echo "$out"
            echo "$out" | grep -E '^(int8|q4) ' | while read -r name rest; do
              tps=$(echo "$rest" | sed -n 's/.*decode *\([0-9][0-9]*\) tok\/s.*/\1/p')
              printf '%s\t%s\t%s\n' "$simd" "$name" "$tps" >> /tmp/kv.tsv
            done
          done
          {
            echo "### Quantized KV decode at 512-token context"
            echo "| path | simd | decode tok/s |"
            echo "|---|---|---:|"
            awk '{printf "| %s | %s | %s |\n",$2,$1,$3}' /tmp/kv.tsv
          } >> "$GITHUB_STEP_SUMMARY"

  summarize:
    name: Summarize
    runs-on: ubuntu-latest
    needs: [pretrain, sft, lora, train-rm, dpo, grpo, ppo, eval]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Per-phase results
        run: |
          {
            echo "### UENR cloud run summary"
            echo "| phase | result | checkpoint tag |"
            echo "|---|---|---|"
            echo "| pretrain | ${{ needs.pretrain.result }} | pretrain-checkpoint |"
            echo "| sft | ${{ needs.sft.result }} | sft-checkpoint |"
            echo "| lora | ${{ needs.lora.result }} | lora-checkpoint |"
            echo "| train-rm | ${{ needs.train-rm.result }} | train-rm-checkpoint |"
            echo "| dpo | ${{ needs.dpo.result }} | dpo-checkpoint |"
            echo "| grpo | ${{ needs.grpo.result }} | grpo-checkpoint |"
            echo "| ppo | ${{ needs.ppo.result }} | ppo-checkpoint |"
            echo "| eval | ${{ needs.eval.result }} | n/a |"
          } >> "$GITHUB_STEP_SUMMARY"
